    <ellipse class="motion-orbit motion-orbit--backward" style="transform-origin:268.4px 292.2px" cx="268.4" cy="292.2" rx="169.2" ry="96.5" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="28 24" opacity="0.1"/>
    <path d="M 52 128 H 94 M 52 128 V 170 M 466 478 H 424 M 466 478 V 436" fill="none" stroke="#58A6FF" stroke-width="1.2" opacity="0.2"/>

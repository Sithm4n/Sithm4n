<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title description">
  <title id="title">Naja Najwa Robbi - Full-Stack Builder</title>
  <desc id="description">A builder profile card with Wildan's high-contrast ASCII portrait, product focus, and selected work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="ascii-signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B949E"/>
      <stop offset="0.48" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#8B949E"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="portrait-halo">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#C9D1D9" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#58A6FF" opacity="0.052"/>
    </pattern>
    <pattern id="portrait-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" fill="none" stroke="#C9D1D9" stroke-width="0.65" opacity="0.085"/>
      <circle cx="0" cy="0" r="1.2" fill="#58A6FF" opacity="0.13"/>
    </pattern>
    <clipPath id="portrait-clip">
      <rect x="24" y="82" width="470" height="438" rx="12"/>
    </clipPath>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .ascii { font-family: 'Courier New', Consolas, monospace; font-size: 4.5px; letter-spacing: -0.3px; fill: url(#ascii-signal); }
      .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 2px; fill: #C9D1D9; opacity: 0.78; }
      .terminal-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; fill: #8B949E; }
      .live-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #58A6FF; }
      .system-head { font-family: 'Courier New', Consolas, monospace; font-size: 16px; font-weight: 700; }
      .system-section, .system-footer, .system-row { font-family: 'Courier New', Consolas, monospace; font-size: 14px; }
      .system-section, .system-key { font-weight: 700; }
      text, tspan { white-space: pre; }
      .motion-orbit { transform-box: view-box; }
      @keyframes orbit-forward { to { transform: rotate(360deg); } }
      @keyframes orbit-backward { to { transform: rotate(-360deg); } }
      @keyframes scan-sweep { from { transform: translateY(0); } to { transform: translateY(750px); } }
      @media (prefers-reduced-motion: no-preference) {
        .motion-orbit--forward { animation: orbit-forward 42s linear infinite; }
        .motion-orbit--backward { animation: orbit-backward 34s linear infinite; }
        .motion-scan { animation: scan-sweep 8s linear infinite; }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion-scan { display: none; }
      }
    </style>
  </defs>
  
  <rect width="1180" height="610" rx="18" fill="url(#background)"/>
  <rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>
  
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#161B22" fill-opacity="0.84"/>
  <circle cx="24" cy="20" r="5" fill="#58A6FF" opacity="0.88"/>
  <circle cx="42" cy="20" r="5" fill="#8B949E" opacity="0.7"/>
  <circle cx="60" cy="20" r="5" fill="#8B949E" opacity="0.78"/>
  <text x="590" y="25" text-anchor="middle" class="terminal-label">Naja@build ~ % ./profile</text>
  <circle cx="1039" cy="20" r="4" fill="#58A6FF"/>
  <text x="1049" y="24" class="live-label">BUILDING</text>
  
